<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Inventory Management System</title>
  <meta name="description" content="Enterprise SaaS Smart Inventory Management System for managing products, categories, suppliers, purchases, sales, and stock tracking with INR currency and GST invoicing." />
  <meta property="og:title" content="Smart Inventory Management System" />
  <meta property="og:description" content="Enterprise SaaS Smart Inventory Management System for managing products, categories, suppliers, purchases, sales, and stock tracking with INR currency and GST invoicing." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-container">
    <!-- Mobile Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">SmartInventory</span>
          <span class="brand-subtitle">Enterprise ERP v1.0</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <span class="nav-section-title">Core Operations</span>

        <!-- 1. Dashboard -->
        <a href="#dashboard" class="nav-item active" data-module="dashboard" onclick="App.navigateTo('dashboard')">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span>
          <span>Dashboard</span>
        </a>

        <!-- 2. Products -->
        <a href="#products" class="nav-item" data-module="products" onclick="App.navigateTo('products')">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
          </span>
          <span>Products</span>
        </a>

        <!-- 3. Categories -->
        <a href="#categories" class="nav-item" data-module="categories" onclick="App.navigateTo('categories')">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          </span>
          <span>Categories</span>
        </a>

        <!-- 4. Suppliers -->
        <a href="#suppliers" class="nav-item" data-module="suppliers" onclick="App.navigateTo('suppliers')">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          <span>Suppliers</span>
        </a>

        <span class="nav-section-title" style="margin-top: 10px;">Transactions</span>

        <!-- 5. Purchases -->
        <a href="#purchases" class="nav-item" data-module="purchases" onclick="App.navigateTo('purchases')">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          </span>
          <span>Purchases</span>
        </a>

        <!-- 6. Sales -->
        <a href="#sales" class="nav-item" data-module="sales" onclick="App.navigateTo('sales')">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
          </span>
          <span>Sales</span>
        </a>

        <!-- 7. Inventory -->
        <a href="#inventory" class="nav-item" data-module="inventory" onclick="App.navigateTo('inventory')">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          </span>
          <span>Inventory</span>
        </a>

        <span class="nav-section-title" style="margin-top: 10px;">Management</span>

        <!-- 8. Reports -->
        <a href="#reports" class="nav-item" data-module="reports" onclick="App.navigateTo('reports')">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          </span>
          <span>Reports</span>
        </a>

        <!-- 9. Settings -->
        <a href="#settings" class="nav-item" data-module="settings" onclick="App.navigateTo('settings')">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </span>
          <span>Settings</span>
        </a>

        <!-- 10. Logout -->
        <a href="javascript:void(0)" class="nav-item" data-module="logout" onclick="App.navigateTo('logout')" style="color: var(--color-danger); margin-top: auto;">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </span>
          <span>Logout</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini-card">
          <div class="user-avatar user-avatar-display">RS</div>
          <div class="user-info">
            <div class="user-name user-name-display">Rajesh Sharma</div>
            <div class="user-role user-role-display">Administrator</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="main-wrapper">
      <!-- Top Navigation Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" onclick="App.toggleMobileSidebar()" aria-label="Toggle Navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>

          <nav class="breadcrumbs">
            <span>Portal</span>
            <span>/</span>
            <span class="breadcrumb-active" id="breadcrumb-current">Dashboard</span>
          </nav>
        </div>

        <!-- Global Search Input -->
        <div class="topbar-search">
          <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" placeholder="Search catalog items, SKU..." onkeydown="if(event.key === 'Enter') App.handleGlobalSearch(this.value)" />
        </div>

        <div class="topbar-right">
          <!-- Light/Dark Mode Switcher -->
          <button class="topbar-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme" onclick="App.toggleTheme()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>

          <!-- Quick Sale Action -->
          <button class="btn btn-primary btn-sm" onclick="SalesModule.openNewSaleModal()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            + New Sale
          </button>
        </div>
      </header>

      <!-- Content Area with All 9 Content Modules -->
      <main class="content-area">
        <div id="module-dashboard" class="module-page active"></div>
        <div id="module-products" class="module-page"></div>
        <div id="module-categories" class="module-page"></div>
        <div id="module-suppliers" class="module-page"></div>
        <div id="module-purchases" class="module-page"></div>
        <div id="module-sales" class="module-page"></div>
        <div id="module-inventory" class="module-page"></div>
        <div id="module-reports" class="module-page"></div>
        <div id="module-settings" class="module-page"></div>
      </main>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- JavaScript Modules in Strict Dependency Order -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/products.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/suppliers.js"></script>
  <script src="js/purchases.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
